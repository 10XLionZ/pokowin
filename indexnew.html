<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Pokowin: Download App</title>

<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
crossorigin="anonymous"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    background: #07072b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    touch-action: none;
}

/* Main */

.container {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 15px;
}

.banner-ad {
    width: 100%;
    max-width: 390px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 15px;
}

/* Screenshot Area */

.slider {
    width: 100%;
    max-width: 390px;

    overflow: hidden;

    position: relative;

    touch-action: none;
}

/* Images */

.track {
    display: flex;

    will-change: transform;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

.track img {
    width: 100%;
    min-width: 100%;

    flex-shrink: 0;

    display: block;

    user-select: none;
    -webkit-user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}

/* Dots */

.dots {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 7px;

    margin-top: 12px;
}

.dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #777;

    transition: 0.25s;
}

.dot.active {
    width: 20px;

    border-radius: 10px;

    background: #ffffff;
}

/* Download Button */

.download {
    display: block;

    margin-top: 22px;

    width: 230px;

    padding: 15px 20px;

    background: #39b54a;

    color: white;

    text-align: center;

    text-decoration: none;

    font-size: 25px;

    font-weight: bold;

    border-radius: 10px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.3);

    -webkit-tap-highlight-color: transparent;
}

.download:active {
    transform: scale(0.97);
}


/* Small phones */

@media (max-height: 650px) {

    .slider {
        max-width: 300px;
    }

    .download {
        margin-top: 15px;
        padding: 11px;
        font-size: 21px;
        width: 200px;
    }

}


/* Bigger phones */

@media (min-height: 800px) {

    .slider {
        max-width: 400px;
    }

}

</style>
</head>


<body>


<div class="container">

    <!-- ADSENSE BANNER -->

    <div class="banner-ad">

        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"
             data-full-width-responsive="true">
        </ins>

        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

    </div>

    <!-- SCREENSHOTS -->

    <div class="slider" id="slider">

        <div class="track" id="track">

            <img src="screenshot1.png"
                 alt="Screenshot 1">

            <img src="screenshot2.png"
                 alt="Screenshot 2">

            <img src="screenshot3.png"
                 alt="Screenshot 3">

            <img src="screenshot4.png"
                 alt="Screenshot 4">

            <img src="screenshot5.png"
                 alt="Screenshot 5">

        </div>


        <!-- DOTS -->

        <div class="dots">

            <span class="dot active"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>

    </div>


    <!-- DOWNLOAD -->

    <a
        href="app-release.apk"
        download
        class="download">

        Download

    </a>


</div>



<script>

const slider =
    document.getElementById("slider");

const track =
    document.getElementById("track");

const dots =
    document.querySelectorAll(".dot");


let index = 0;

let startX = 0;

let currentX = 0;

let dragging = false;


/* =========================
   SHOW IMAGE
========================= */

function showImage(i) {

    index = i;

    track.style.transition =
        "transform 0.35s ease-out";

    track.style.transform =
        "translateX(-" + (index * 100) + "%)";


    dots.forEach((dot, n) => {

        dot.classList.toggle(
            "active",
            n === index
        );

    });

}


/* =========================
   TOUCH START
========================= */

slider.addEventListener(
    "touchstart",
    function(e) {

        startX =
            e.touches[0].clientX;

        currentX = startX;

        dragging = true;

        track.style.transition =
            "none";

    },
    { passive: false }
);


/* =========================
   TOUCH MOVE
========================= */

slider.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging) return;

        e.preventDefault();

        currentX =
            e.touches[0].clientX;

        let move =
            currentX - startX;


        /*
          Current image को
          finger के साथ move करें
        */

        let position =
            (-index * slider.offsetWidth)
            + move;


        /*
          First और last image
          पर resistance
        */

        if (
            index === 0 &&
            move > 0
        ) {

            position =
                move * 0.25;

        }


        if (
            index === dots.length - 1 &&
            move < 0
        ) {

            position =
                (-index * slider.offsetWidth)
                + move * 0.25;

        }


        track.style.transform =
            "translateX(" +
            position +
            "px)";

    },
    { passive: false }
);


/* =========================
   TOUCH END
========================= */

slider.addEventListener(
    "touchend",
    function() {

        if (!dragging) return;

        dragging = false;


        let distance =
            currentX - startX;


        /*
          RIGHT → LEFT
        */

        if (
            distance < -50 &&
            index < dots.length - 1
        ) {

            index++;

        }


        /*
          LEFT → RIGHT
        */

        else if (
            distance > 50 &&
            index > 0
        ) {

            index--;

        }


        /*
          वापस सही position
        */

        showImage(index);

    }
);


/* =========================
   PREVENT LONG PRESS
========================= */

slider.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);

</script>

</body>
</html>
